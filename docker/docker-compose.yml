services:
  postgres:
    image: postgres:16-alpine
    container_name: mango-list-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mango_list
      POSTGRES_USER: mango_app
      POSTGRES_PASSWORD: local_password
    ports:
      - '5432:5432'
    volumes:
      - mango_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mango_app -d mango_list']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mango_postgres_data:
